# Alloy dev stack for the Zafar frontend.
#
# The frontend is plain HTML/CSS/JS, so it only needs a static file server.
# server.js has zero npm dependencies, which keeps the container boot instant
# and offline-safe. The Cloudflare Worker (worker.js) and the FastAPI backend
# are deployed services, not part of this stack — the frontend talks to the
# backend over HTTPS (API_BASE_URL in web/assets/js/config.js) and falls back
# to bundled demo data when it can't be reached.

services:
  web:
    image: node:22-bookworm-slim
    working_dir: /workspace
    network_mode: host
    environment:
      PORT: "4173"
      HOST: "0.0.0.0"
      IS_ALLOY: "${IS_ALLOY:-false}"
    volumes:
      - .:/workspace
    command: node server.js
    restart: unless-stopped

<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Books — Zafar</title>
<meta name="description" content="Browse and download senior and junior secondary school textbooks.">
<link rel="stylesheet" href="assets/css/app.css">
<script>try{var t=localStorage.getItem("zafar_theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body>
  <div id="app"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/demo.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/list.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var shell = ZafarShell.init({ active: "books", title: "Books", crumb: "Library" });
      if (!shell) return;
      ZafarList.init({
        section: "books",
        quotaKey: "books",
        itemLabel: "book",
        searchPlaceholder: "Search textbooks by title or form…",
        categories: ["Senior", "Junior"],
      }, shell);
    });
  </script>
</body>
</html>
